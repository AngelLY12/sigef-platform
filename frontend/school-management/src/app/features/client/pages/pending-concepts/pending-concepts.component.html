<app-page-layout
  title="Conceptos de pago"
  welcomeMessage="Aquí puedes ver los conceptos de pago que aplican a ti."
  loadingMessage="Cargando conceptos..."
  icon="receipt"
  [refreshable]="true"
  [refreshing]="loading === 'loading'"
  (refresh)="onRefreshData()"
  [state]="loading"
  (retry)="loadConcepts()"
>
  <app-folder-tabs [tabs]="conceptsTabs" [(activeTab)]="activeConceptTab">
    @switch (activeConceptTab) {
      @case ("pending") {
        <app-pending-concepts-list
          [concepts]="pending ?? []"
          [loadingConceptId]="loadingConceptId"
          message="No hay conceptos pendientes disponibles"
          (pay)="onPay($event)"
        />
      }

      @case ("overdue") {
        <app-pending-concepts-list [concepts]="overdue ?? []" message="No hay conceptos vencidos disponibles" />
      }
    }
  </app-folder-tabs>
</app-page-layout>
