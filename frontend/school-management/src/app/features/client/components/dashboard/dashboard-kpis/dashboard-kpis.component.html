<div class="kpi-grid">
    <app-kpi-card
      [item]="{
      icon: 'pending_actions',
      iconType: 'alerts',
      label: 'Pendientes',
      value: pendingSummary?.totalAmount | currencyMXN,
      subtext: `${pendingSummary?.totalCount ?? '0'} concepto(s)`
      }"

    />

    <app-kpi-card
      [item]="{
        icon: 'payments',
        iconType: 'growth',
        label: 'Pagado',
        value: paidSummary?.totalPayments | currencyMXN,
        subtext: 'Total acumulado'
      }"
    />

    <app-kpi-card
      [item]="{
        icon: 'warning',
        iconType: 'inactive',
        label: 'Vencidos',
        value: overdueSummary?.totalAmount | currencyMXN,
        subtext: `${overdueSummary?.totalCount ?? '0'} conceptos`
      }"
    />
    <app-kpi-card
      [item]="{
        icon: 'payments',
        iconType: 'growth',
        label: 'Recuperación',
        value: recoveryRate
      }"
    />
  </div>
