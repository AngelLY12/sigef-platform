<app-page-layout
  title="Panel de administración"
  welcomeMessage="Bienvenido de nuevo"
  loadingMessage="Cargando resumen..."
  icon="dashboard"
  [showAlertBadge]="hasAlerts"
  [state]="state"
  [refreshable]="true"
  [refreshing]="state === 'loading'"
  (refresh)="onRefreshData()"
  (retry)="loadSummary()"
  [alertCount]="getTotalAlerts"
>
  <div *ngIf="summary && state != 'loading'" class="dashboard-content">
    <app-dashboard-overview
      [summary]="summary"
      [totalAlerts]="getTotalAlerts"
      [hasAlerts]="hasAlerts">
    </app-dashboard-overview>

    <app-dashboard-charts
      [summary]="summary">
    </app-dashboard-charts>

    <app-dashboard-details
      [summary]="summary">
    </app-dashboard-details>
    <app-dashboard-category-details
      [summary]="summary">
    </app-dashboard-category-details>
  </div>
</app-page-layout>
