<app-page-layout
  title="Importar"
  welcomeMessage="En este apartado puedes importar archivos Excel"
  icon="upload_file"
>
  <app-import-panel
    [mode]="importMode"
    [file]="file"
    [loading]="currentState === 'loading'"
    (modeChange)="onChangeImportMode()"
    (fileChange)="onFileChange($event)"
    (downloadTemplate)="downloadTemplate()"
    (import)="onImport()"
  />
</app-page-layout>
