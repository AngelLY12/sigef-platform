<app-metadata-card title="Concepto creado">
  <div metadata-body>
    <app-metadata-row
      label="Usuario notificado"
      [value]="metadata.recipientName"
    />
    <app-metadata-row label="Concepto" [value]="metadata.conceptName" />
    <app-metadata-row label="Monto" [value]="metadata.amount | currencyMXN" />
    <app-metadata-row label="Fecha de inicio" [value]="metadata.startDate" />
    @if (metadata.endDate) {
      <app-metadata-row label="Fecha de fin" [value]="metadata.endDate" />
    }
  </div>
</app-metadata-card>
