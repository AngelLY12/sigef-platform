<app-section-divider>Visión General</app-section-divider>

<div class="kpi-grid">
  <app-kpi-card
    [item]="{
      icon: 'people',
      iconType: 'total',
      label: 'Total Usuarios',
      value: summary.populationSummary.total_users,
      trend: {
        icon: 'arrow_upward',
        text: '+' + summary.recentActivity.new_users_today + ' hoy',
      },
    }"
  >
  </app-kpi-card>

  <app-kpi-card
    [item]="{
      icon: 'check_circle',
      iconType: 'active',
      label: 'Usuarios Activos',
      value: summary.populationSummary.active_users,
      percentage: usersPercentage,
    }"
  >
  </app-kpi-card>

  <app-kpi-card
    [item]="{
      icon: 'school',
      iconType: 'students',
      label: 'Estudiantes',
      value: summary.academicSummary.students_total,
      subtext: summary.academicSummary.students_with_career + ' con carrera',
    }"
  >
  </app-kpi-card>

  <app-kpi-card
    [item]="{
      icon: 'warning',
      iconType: 'alerts',
      label: 'Alertas',
      value: totalAlerts,
      subtext: 'Requieren atención',
    }"
    [class.has-alerts]="hasAlerts"
  >
  </app-kpi-card>
</div>
