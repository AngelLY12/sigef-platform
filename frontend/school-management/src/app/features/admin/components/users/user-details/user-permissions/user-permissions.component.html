<app-button
  variant="ghost"
  size="sm"
  iconLeft="edit"
  [loading]="loading"
  [disabled]="loading"
  (click)="edit.emit()"
>
  Editar
</app-button>

@if (permissionsItems!.length > 0) {
  @for (item of permissionsItems; track item.label) {
    <app-info-card-item [item]="item"> </app-info-card-item>
  }
} @else {
  <span class="no-info"> No hay permisos asignados </span>
}
