<app-page-layout
  [title]="concept?.concept_name!"
  [welcomeMessage]="concept?.description || 'Sin descripción '"
  loadingMessage="Cargando concepto..."
  icon="receipt"
  [state]="state"
  (retry)="loadConceptData(conceptId!)"
>
  @if (concept && state === "success") {
    <ng-template #conceptActions>
      @if (activeDetailSection?.editable) {
        <app-button variant="primary" iconLeft="edit" (click)="openEdit()">
          Editar
        </app-button>
      }
    </ng-template>

    <app-folder-tabs
      [tabs]="conceptTabs"
      [(activeTab)]="activeSection"
      [actionsTemplate]="conceptActions"
    >
      @for (section of detailSections; track section.key) {
        @if (activeSection === section.key) {
          <div class="detail-list">
            @for (item of section.items; track item.label) {
              <app-info-card-item
                [item]="item"
              />
            }
          </div>
        }
      }
    </app-folder-tabs>
  }
</app-page-layout>
