<div class="main-content">
  <app-breadcrumb />
  <ng-container *ngIf="headerContent; else defaultHeader">
    <ng-container *ngTemplateOutlet="headerContent"></ng-container>
  </ng-container>

  <ng-template #defaultHeader>
    <app-dashboard-header
      [title]="title"
      [icon]="icon"
      [iconSize]="iconSize"
      [welcomeMessage]="welcomeMessage"
      [date]="currentDate"
      [showAlertBadge]="showAlertBadge"
      [alertCount]="alertCount"
      [hasHeaderBottomContent]="!!headerBottom"
      [iconClickable]="iconClickeable"
      (iconAction)="onIconAction()"
    >
      <ng-container actions *ngIf="headerActions || refreshable">
        <app-button
          *ngIf="refreshable"
          variant="ghost"
          size="sm"
          iconLeft="refresh"
          [iconOnly]="true"
          [loading]="refreshing"
          [disabled]="refreshing"
          matTooltip="Actualizar datos"
          (click)="refresh.emit()"
        ></app-button>

        <ng-container *ngIf="headerActions">
          <ng-container *ngTemplateOutlet="headerActions"></ng-container>
        </ng-container>
      </ng-container>

      <ng-container *ngIf="headerBottom">
        <ng-container *ngTemplateOutlet="headerBottom"></ng-container>
      </ng-container>
    </app-dashboard-header>
  </ng-template>

  <div *ngIf="isLoading" class="loading-container">
    <app-spinner [loading]="true" size="xl" color="primary"></app-spinner>
    <p>{{ loadingMessage }}...</p>
  </div>

  <app-error-state
    *ngIf="state === 'error'"
    [message]="errorMessage"
    (retry)="retry.emit()"
  ></app-error-state>

  <div *ngIf="state === 'success'" class="content-wrapper">
    <ng-content></ng-content>
  </div>
</div>
