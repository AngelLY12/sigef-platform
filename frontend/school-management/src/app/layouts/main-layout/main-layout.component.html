<div class="main-layout">

  <app-sidebar
    [sideBarItems]="sideBarItems"
    [role]="userRole"
    [userName]="userName"
    [userAvatar]="userAvatar"
    [collapsed]="collapsed"
    (collapsedChange)="onCollapsedChange($event)"
    [showRoleSelector]="shouldShowRoleSelector()"
    [showChildrenSelector]="canSelectChildren()"
    (changeRole)="openRoleSelector()"
    (selectChild)="openChildrenSelector()"

  ></app-sidebar>

  <main class="main-content" [class.sidebar-collapsed] ="collapsed">
    <router-outlet></router-outlet>
  </main>

</div>

<app-role-selector
  [show]="showRoleSelector"
  [roles]="userRoles"
  [userName]="userName"
  (roleSelected)="onRoleSelected($event)"
  (close)="onSelectorClose()">
</app-role-selector>

<app-children-selector
  *ngIf="isChildrenSelectorOpen"
  [show]="isChildrenSelectorOpen"
  (childSelected)="onChildSelected($event)"
  (close)="onChildrenSelectorClose()">
</app-children-selector>
